<!-- /*
● Create a blog list page that fetches a list of users from a mock API and adds them to a
table on the page after loading. Add a button to sort the users by name. Add an input to
filter the table by search. (Optional: Show “Loading...” or a loading spinner on the screen
till the data loads)
*/ -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th,
        td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #f4f4f4;
        }

        input,
        button {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .loading {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>User List</h1>

    <!-- Search input -->
    <input type="text" id="searchInput" placeholder="Search by name" oninput="filterTable()">
    <button onclick="sortByName()">Sort by Name</button>

    <!-- Loading message -->
    <div id="loading" class="loading">Loading...</div>

    <!-- Table to display users -->
    <table id="userTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Avatar</th>
            </tr>
        </thead>
        <tbody>
            <!-- User rows will be populated here -->
        </tbody>
    </table>

    <script>
        // Global variable to hold users data
        let users = [];

        // Function to fetch users data from the mock API
        const fetchUsers = async () => {
            try {
                const response = await fetch('https://reqres.in/api/users?page=1');
                const data = await response.json();

                // Store users data in the global variable
                users = data.data;

                // Hide loading text and display the table
                document.getElementById('loading').style.display = 'none';
                displayUsers(users);
            } catch (error) {
                console.error('Error fetching users:', error);
            }
        };

        // Function to display the list of users in the table
        const displayUsers = (usersList) => {
            const tableBody = document.querySelector('#userTable tbody');
            tableBody.innerHTML = '';

            usersList.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
            <td>${user.first_name} ${user.last_name}</td>
            <td>${user.email}</td>
            <td><img src="${user.avatar}" alt="${user.first_name}" width="50"></td>
        `;
                tableBody.appendChild(row);
            });
        };

        // Function to sort users by name (first name + last name)
        const sortByName = () => {
            const sortedUsers = [...users].sort((a, b) => {
                const nameA = a.first_name.toLowerCase() + a.last_name.toLowerCase();
                const nameB = b.first_name.toLowerCase() + b.last_name.toLowerCase();
                return nameA.localeCompare(nameB);
            });
            displayUsers(sortedUsers);
        };

        // Function to filter the table based on search input
        const filterTable = () => {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const filteredUsers = users.filter(user => {
                const fullName = (user.first_name + ' ' + user.last_name).toLowerCase();
                return fullName.includes(searchQuery);
            });
            displayUsers(filteredUsers);
        };

        // Initial fetch of users
        fetchUsers();
    </script>

</body>

</html>
