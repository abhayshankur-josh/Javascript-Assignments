<!-- /*
● Create a form to submit a blog to a mock API (reqres.in)
*/ -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Blog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        form {
            max-width: 500px;
            margin: 0 auto;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

    <h1>Submit Your Blog</h1>

    <!-- Blog submission form -->
    <form id="blogForm">
        <label for="title">Blog Title:</label>
        <input type="text" id="title" name="title" required />

        <label for="body">Blog Body:</label>
        <textarea id="body" name="body" rows="5" required></textarea>

        <button type="submit">Submit Blog</button>
    </form>

    <script>
        document.getElementById('blogForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            // Get values from the form inputs
            const title = document.getElementById('title').value;
            const body = document.getElementById('body').value;

            // Create the blog object to be sent to the API
            const blogData = {
                title: title,
                body: body,
                userId: 3812
            };

            try {
                // Send a POST request to the mock API
                const response = await fetch('https://reqres.in/api/posts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(blogData)
                });

                // Check if the response is OK (status 200-299)
                if (response.ok) {
                    const responseData = await response.json();
                    alert('Blog submitted successfully!');
                    console.log(responseData);
                } else {
                    alert('Failed to submit blog. Try again later.');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>

</body>

</html>
